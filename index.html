
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-app">
        <h1>☀️ Weather App</h1>
        <p class="subtitle">Discover the weather in your city</p>

        <form id="weatherForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <p id="message" role="status">Enter a city to check its weather.</p>

        <section id="weatherResult" class="weather-card" hidden>
            <h2 id="cityName"></h2>
            <p id="localTime" class="local-time"></p>

            <img id="weatherIcon" src="" alt="Weather condition">

            <div class="temperature">
                <span id="temperature">--</span><span>°C</span>
            </div>

            <p id="condition" class="condition"></p>

            <div class="details">
                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>
            </div>

            <p class="updated">Updated: <span id="updatedAt"></span></p>
        </section>

        <footer>Weather data powered by WeatherAPI.com</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
